<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Task 2</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <!-- Left Side - Illustration/Info -->
    <div class="info-container">
        <div class="info-box">
            <h2>Welcome Back!</h2>
            <p>To keep connected with us, please login with your personal info.</p>
            <a href="login.html" class="btn btn-secondary">Sign In</a>
        </div>
    </div>

    <!-- Right Side - Form -->
    <div class="form-container">
        <div class="form-box">
            <!-- Logo/Title -->
            <div class="form-header">
                <h1>Create Account</h1>
                <p>Join us today</p>
            </div>

            <!-- Registration Form -->
            <form id="registerForm">
                <!-- Name Input -->
                <div class="form-group">
                    <label for="name">
                        <i class="fas fa-user"></i> Full Name
                    </label>
                    <input 
                        type="text" 
                        id="name" 
                        name="name" 
                        placeholder="Enter your full name"
                        required
                    >
                    <span class="error-message" id="nameError"></span>
                </div>

                <!-- Email Input -->
                <div class="form-group">
                    <label for="regEmail">
                        <i class="fas fa-envelope"></i> Email
                    </label>
                    <input 
                        type="email" 
                        id="regEmail" 
                        name="email" 
                        placeholder="Enter your email"
                        required
                    >
                    <span class="error-message" id="regEmailError"></span>
                </div>

                <!-- Password Input -->
                <div class="form-group">
                    <label for="regPassword">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="regPassword" 
                            name="password" 
                            placeholder="Create a password"
                            required
                        >
                        <button 
                            type="button" 
                            class="toggle-password"
                            onclick="togglePassword('regPassword')"
                            title="Show/Hide Password"
                        >
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="password-strength">
                        <div class="strength-bar"></div>
                        <span class="strength-text">Password strength: <strong id="strengthLevel">Weak</strong></span>
                    </div>
                    <span class="error-message" id="regPasswordError"></span>
                </div>

                <!-- Confirm Password Input -->
                <div class="form-group">
                    <label for="confirmPassword">
                        <i class="fas fa-lock"></i> Confirm Password
                    </label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            name="confirmPassword" 
                            placeholder="Confirm your password"
                            required
                        >
                        <button 
                            type="button" 
                            class="toggle-password"
                            onclick="togglePassword('confirmPassword')"
                            title="Show/Hide Password"
                        >
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <span class="error-message" id="confirmPasswordError"></span>
                </div>

                <!-- Terms & Conditions -->
                <label class="checkbox-group">
                    <input type="checkbox" id="terms" name="terms" required>
                    <span>I agree to the <a href="#">Terms & Conditions</a></span>
                </label>
                <span class="error-message" id="termsError"></span>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary btn-full">
                    <span class="btn-text">Sign Up</span>
                    <span class="btn-loader" style="display: none;">
                        <i class="fas fa-spinner fa-spin"></i>
                    </span>
                </button>

                <!-- Divider -->
                <div class="divider">
                    <span>Or</span>
                </div>

                <!-- Social Signup -->
                <div class="social-login">
                    <button type="button" class="btn-social" title="Sign up with Google">
                        <i class="fab fa-google"></i>
                    </button>
                    <button type="button" class="btn-social" title="Sign up with Facebook">
                        <i class="fab fa-facebook"></i>
                    </button>
                    <button type="button" class="btn-social" title="Sign up with GitHub">
                        <i class="fab fa-github"></i>
                    </button>
                </div>
            </form>

            <!-- Sign In Link -->
            <div class="form-footer">
                <p>Already have an account? <a href="login.html">Sign in here</a></p>
            </div>
        </div>
    </div>
</div>

<!-- Toast Notification -->
<div id="toast" class="toast"></div>

<script src="script.js"></script>

</body>
</html>
