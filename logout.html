<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout - Task 2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .logout-container {
            background: white;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logout-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .logout-container h2 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .logout-container p {
            color: #888;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .message {
            color: #28a745;
            font-weight: 600;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="logout-container">
    <div class="logout-icon">👋</div>
    <h2>Logging Out</h2>
    <p>You are being logged out. Please wait...</p>
    <div class="spinner"></div>
    <p class="message">✅ You have been successfully logged out!</p>
    <p style="color: #888; font-size: 14px; margin-top: 20px;">Redirecting to login page...</p>
</div>

<script>
    // Clear all user data
    localStorage.removeItem('userData');
    sessionStorage.removeItem('userData');
    
    // Redirect to login after 2 seconds
    setTimeout(function() {
        window.location.href = 'login.html';
    }, 2000);
</script>

</body>
</html>
