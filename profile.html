<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Task 2</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .back-button:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }

        .profile-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            text-align: center;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            margin: 0 auto 20px;
            color: white;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.3);
        }

        .profile-card h2 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .profile-card p {
            color: #888;
            margin-bottom: 30px;
        }

        .profile-info {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            text-align: left;
            margin-bottom: 25px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #667eea;
            font-weight: 600;
        }

        .info-value {
            color: #333;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
            transform: translateY(-2px);
        }

        @media (max-width: 480px) {
            .profile-card {
                padding: 25px;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <a href="dashboard.html" class="back-button">← Back to Dashboard</a>

    <div class="profile-card">
        <div class="profile-avatar">👤</div>
        <h2 id="userName">User Name</h2>
        <p id="userStatus">Active Member</p>

        <div class="profile-info">
            <div class="info-row">
                <span class="info-label"><i class="fas fa-envelope"></i> Email:</span>
                <span class="info-value" id="profileEmail">user@example.com</span>
            </div>
            <div class="info-row">
                <span class="info-label"><i class="fas fa-calendar"></i> Member Since:</span>
                <span class="info-value" id="memberSince">Today</span>
            </div>
            <div class="info-row">
                <span class="info-label"><i class="fas fa-user"></i> Status:</span>
                <span class="info-value" style="color: #28a745;">✅ Active</span>
            </div>
        </div>

        <div class="button-group">
            <button class="btn btn-primary" onclick="editProfile()">✏️ Edit Profile</button>
            <a href="logout.php" class="btn btn-danger" onclick="return confirm('Logout?')">🚪 Logout</a>
        </div>
    </div>
</div>

<script>
    function loadProfile() {
        const userData = JSON.parse(localStorage.getItem('userData') || sessionStorage.getItem('userData'));
        
        if (!userData) {
            window.location.href = 'login.html';
            return;
        }
        
        document.getElementById('userName').textContent = userData.name || 'User';
        document.getElementById('profileEmail').textContent = userData.email;
        document.getElementById('memberSince').textContent = new Date(userData.loginTime).toLocaleDateString();
    }

    function editProfile() {
        alert('Edit profile feature coming soon!');
    }

    window.addEventListener('load', loadProfile);
</script>

</body>
</html>
