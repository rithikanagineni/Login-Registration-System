<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Task 2</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .back-button:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }

        .settings-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .settings-card h2 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .settings-group {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e0e0e0;
        }

        .settings-group:last-child {
            border-bottom: none;
        }

        .settings-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
        }

        .settings-label {
            font-weight: 600;
            color: #333;
        }

        .toggle-switch {
            position: relative;
            width: 60px;
            height: 30px;
            background: #ccc;
            border-radius: 15px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .toggle-switch.active {
            background: #28a745;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 26px;
            height: 26px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: left 0.3s;
        }

        .toggle-switch.active::after {
            left: 32px;
        }

        .select-box {
            padding: 8px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
        }

        .select-box:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }

        @media (max-width: 480px) {
            .settings-card {
                padding: 20px;
            }

            .settings-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <a href="dashboard.html" class="back-button">← Back to Dashboard</a>

    <div class="settings-card">
        <h2><i class="fas fa-cog"></i> Account Settings</h2>

        <div class="settings-group">
            <div class="settings-item">
                <span class="settings-label">Email Notifications</span>
                <div class="toggle-switch active" onclick="toggleSwitch(this)"></div>
            </div>
            <div class="settings-item">
                <span class="settings-label">Push Notifications</span>
                <div class="toggle-switch" onclick="toggleSwitch(this)"></div>
            </div>
            <div class="settings-item">
                <span class="settings-label">Marketing Emails</span>
                <div class="toggle-switch active" onclick="toggleSwitch(this)"></div>
            </div>
        </div>

        <div class="settings-group">
            <h3 style="color: #333; margin-bottom: 15px;">Preferences</h3>
            <div class="settings-item">
                <span class="settings-label">Theme</span>
                <select class="select-box">
                    <option>Light</option>
                    <option>Dark</option>
                    <option>Auto</option>
                </select>
            </div>
            <div class="settings-item">
                <span class="settings-label">Language</span>
                <select class="select-box">
                    <option>English</option>
                    <option>Spanish</option>
                    <option>French</option>
                </select>
            </div>
        </div>

        <button class="btn" onclick="saveSettings()">💾 Save Settings</button>
    </div>
</div>

<script>
    function toggleSwitch(element) {
        element.classList.toggle('active');
    }

    function saveSettings() {
        alert('✅ Settings saved successfully!');
    }
</script>

</body>
</html>
