<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Task 2</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <!-- Left Side - Form -->
    <div class="form-container">
        <div class="form-box">
            <!-- Logo/Title -->
            <div class="form-header">
                <h1>Welcome Back</h1>
                <p>Login to your account</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <!-- Email Input -->
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i> Email
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Enter your email"
                        required
                    >
                    <span class="error-message" id="emailError"></span>
                </div>

                <!-- Password Input -->
                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Enter your password"
                            required
                        >
                        <button 
                            type="button" 
                            class="toggle-password" 
                            onclick="togglePassword('password')"
                            title="Show/Hide Password"
                        >
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <span class="error-message" id="passwordError"></span>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary btn-full">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-loader" style="display: none;">
                        <i class="fas fa-spinner fa-spin"></i>
                    </span>
                </button>

                <!-- Divider -->
                <div class="divider">
                    <span>Or</span>
                </div>

                <!-- Social Login -->
                <div class="social-login">
                    <button type="button" class="btn-social" title="Login with Google">
                        <i class="fab fa-google"></i>
                    </button>
                    <button type="button" class="btn-social" title="Login with Facebook">
                        <i class="fab fa-facebook"></i>
                    </button>
                    <button type="button" class="btn-social" title="Login with GitHub">
                        <i class="fab fa-github"></i>
                    </button>
                </div>
            </form>

            <!-- Sign Up Link -->
            <div class="form-footer">
                <p>Don't have an account? <a href="register.html">Sign up here</a></p>
            </div>
        </div>
    </div>

    <!-- Right Side - Illustration/Info -->
    <div class="info-container">
        <div class="info-box">
            <h2>Hello, Friend!</h2>
            <p>Enter your personal details and start your journey with us.</p>
            <a href="register.html" class="btn btn-secondary">Sign Up</a>
        </div>
    </div>
</div>

<!-- Toast Notification -->
<div id="toast" class="toast"></div>

<script src="script.js"></script>

</body>
</html>
