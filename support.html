<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support - Task 2</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .back-button:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }

        .support-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .support-card h2 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .support-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .support-option {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid #e0e0e0;
            transition: all 0.3s;
            cursor: pointer;
        }

        .support-option:hover {
            border-color: #667eea;
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .support-option i {
            font-size: 32px;
            color: #667eea;
            margin-bottom: 10px;
        }

        .support-option h3 {
            color: #333;
            margin-bottom: 8px;
        }

        .support-option p {
            color: #888;
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            width: 100%;
            margin-top: 20px;
        }

        .btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }

        @media (max-width: 480px) {
            .support-card {
                padding: 20px;
            }

            .support-options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <a href="dashboard.html" class="back-button">← Back to Dashboard</a>

    <div class="support-card">
        <h2><i class="fas fa-headset"></i> Customer Support</h2>

        <h3 style="color: #333; margin-bottom: 20px;">How can we help you?</h3>

        <div class="support-options">
            <div class="support-option" onclick="selectOption('email')">
                <i class="fas fa-envelope"></i>
                <h3>Email</h3>
                <p>support@example.com</p>
            </div>
            <div class="support-option" onclick="selectOption('chat')">
                <i class="fas fa-comments"></i>
                <h3>Live Chat</h3>
                <p>Available 24/7</p>
            </div>
            <div class="support-option" onclick="selectOption('phone')">
                <i class="fas fa-phone"></i>
                <h3>Phone</h3>
                <p>+1 (555) 123-4567</p>
            </div>
        </div>

        <hr style="margin: 30px 0; border: none; border-top: 1px solid #e0e0e0;">

        <h3 style="color: #333; margin-bottom: 20px;">Send us a message</h3>

        <form id="supportForm">
            <div class="form-group">
                <label for="subject">
                    <i class="fas fa-tag"></i> Subject
                </label>
                <input type="text" id="subject" placeholder="What is this about?" required>
            </div>

            <div class="form-group">
                <label for="message">
                    <i class="fas fa-comment"></i> Message
                </label>
                <textarea id="message" rows="5" placeholder="Describe your issue in detail..." required></textarea>
            </div>

            <button type="submit" class="btn">📧 Send Message</button>
        </form>
    </div>
</div>

<script>
    function selectOption(option) {
        alert('📞 ' + option.toUpperCase() + ' support option selected!');
    }

    document.getElementById('supportForm').addEventListener('submit', function(e) {
        e.preventDefault();
        alert('✅ Your support ticket has been submitted! We will get back to you soon.');
        this.reset();
    });
</script>

</body>
</html>
